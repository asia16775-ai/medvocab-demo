<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedVocab — เข้าสู่ระบบ</title>
  <style>
    :root { --primary: #003087; --primary-l: #0051CC; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1565c0 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      border-radius: 22px; padding: 40px 36px 36px;
      width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo .icon { font-size: 48px; display: block; margin-bottom: 8px; }
    .logo h1 { font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
    .logo p { font-size: 12px; color: #888; margin-top: 4px; }
    .badge { display: inline-block; background: #e3f2fd; color: #1565c0; font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 700; margin-left: 6px; vertical-align: middle; }

    .mode-toggle { display: flex; background: #f0f2f5; border-radius: 12px; padding: 4px; margin-bottom: 22px; gap: 4px; }
    .mode-btn { flex: 1; padding: 9px; border: none; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; background: transparent; color: #999; transition: all 0.2s; font-family: inherit; }
    .mode-btn.active { background: #fff; color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,0.12); }

    label { display: block; font-size: 12px; color: #555; margin-bottom: 5px; font-weight: 600; }
    input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid rgba(60,60,67,0.2); border-radius: 10px;
      font-size: 14px; outline: none; transition: all 0.15s;
      background: rgba(255,255,255,0.8); font-family: inherit; margin-bottom: 14px;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,48,135,0.1); }
    input.pin { letter-spacing: 4px; }
    .btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--primary), var(--primary-l));
      color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      box-shadow: 0 4px 14px rgba(0,48,135,0.3);
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #90a4ae; cursor: not-allowed; box-shadow: none; }
    .btn.admin { background: linear-gradient(135deg, #37474f, #455a64); box-shadow: 0 4px 14px rgba(55,71,79,0.3); }
    .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 14px; }
    .divider hr { flex: 1; border: none; border-top: 1px solid #eee; }
    .divider span { font-size: 12px; color: #bbb; }
    .btn-secondary {
      width: 100%; padding: 12px; background: #fff; color: var(--primary);
      border: 1.5px solid var(--primary); border-radius: 10px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.2s; font-family: inherit;
    }
    .btn-secondary:hover { background: #e8eaf6; }
    .error { background: #ffebee; color: #c62828; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 10px; display: none; }
    .admin-hint { background: #eceff1; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #607d8b; margin-top: 10px; text-align: center; }
    .footer { text-align: center; margin-top: 22px; font-size: 11px; color: #ccc; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="icon">🩺</span>
      <h1>MedVocab <span class="badge">DEMO</span></h1>
      <p>ระบบทบทวนคำศัพท์ทางการแพทย์ · โลหิตวิทยา</p>
    </div>

    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-user" onclick="switchMode('user')">👤 นิสิต</button>
      <button class="mode-btn" id="btn-admin" onclick="switchMode('admin')">🔐 ผู้วิจัย</button>
    </div>

    <!-- User Login -->
    <div id="user-section">
      <label>Username</label>
      <input type="text" id="username" placeholder="กรอก username" autocomplete="off" autocapitalize="off">
      <label>รหัสผ่าน (4 หลัก)</label>
      <input type="password" id="password" placeholder="••••" maxlength="4" inputmode="numeric" class="pin">
      <button class="btn" id="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
      <div class="error" id="user-err"></div>
      <div class="divider"><hr><span>ยังไม่มีบัญชี?</span><hr></div>
      <button class="btn-secondary" onclick="location.href='demo-register.html'">📝 ลงทะเบียนครั้งแรก</button>
    </div>

    <!-- Admin Login -->
    <div id="admin-section" style="display:none">
      <label>รหัสผ่านผู้วิจัย</label>
      <input type="password" id="admin-pass" placeholder="••••••••" autocomplete="off">
      <button class="btn admin" onclick="doAdminLogin()">เข้าสู่ Admin Panel</button>
      <div class="error" id="admin-err"></div>
      <div class="admin-hint">🔒 เฉพาะผู้วิจัยเท่านั้น</div>
    </div>

    <div class="footer">คณะแพทยศาสตร์ มหาวิทยาลัยบูรพา · ปีการศึกษา 2569<br>ข้อมูลส่วนบุคคลได้รับการคุ้มครองตาม PDPA</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dbchducvmgkkccwemmhl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5O2V4_4eY3umLJgQhm6BAQ_0psABX8g';
    const HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };
    const ADMIN_PASSWORD = 'ADMIN2025';

    function switchMode(mode) {
      const isAdmin = mode === 'admin';
      document.getElementById('user-section').style.display  = isAdmin ? 'none' : 'block';
      document.getElementById('admin-section').style.display = isAdmin ? 'block' : 'none';
      document.getElementById('btn-user').classList.toggle('active', !isAdmin);
      document.getElementById('btn-admin').classList.toggle('active', isAdmin);
      document.getElementById('user-err').style.display  = 'none';
      document.getElementById('admin-err').style.display = 'none';
    }

    async function doLogin() {
      const username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();
      const err = document.getElementById('user-err');
      const btn = document.getElementById('login-btn');
      err.style.display = 'none';

      if (!username) { err.textContent = '⚠️ กรุณากรอก Username'; err.style.display = 'block'; return; }
      if (password.length !== 4 || isNaN(password)) { err.textContent = '⚠️ รหัสผ่านต้องเป็นตัวเลข 4 หลัก'; err.style.display = 'block'; return; }

      btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/users?username=eq.${username}&password=eq.${password}&select=username,group,pre_test_done`,
          { headers: HEADERS }
        );
        const data = await res.json();
        if (!data || data.length === 0) {
          err.textContent = '❌ Username หรือรหัสผ่านไม่ถูกต้อง';
          err.style.display = 'block';
        } else {
          localStorage.setItem('mv_current', username);
          location.href = 'demo-home.html';
        }
      } catch (e) {
        err.textContent = '❌ เกิดข้อผิดพลาด กรุณาลองใหม่';
        err.style.display = 'block';
      }
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    }

    function doAdminLogin() {
      const pass = document.getElementById('admin-pass').value.trim().toUpperCase();
      const err  = document.getElementById('admin-err');
      err.style.display = 'none';
      if (pass === ADMIN_PASSWORD) {
        sessionStorage.setItem('mv_admin', '1');
        location.href = 'demo-admin.html';
      } else {
        err.textContent = '❌ รหัสผ่านไม่ถูกต้อง';
        err.style.display = 'block';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('admin-section').style.display !== 'none') doAdminLogin();
      else doLogin();
    });
  </script>
</body>
</html>
