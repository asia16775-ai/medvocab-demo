<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedVocab — เข้าสู่ระบบ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1565c0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px 36px;
      width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo .icon { font-size: 48px; display: block; margin-bottom: 8px; }
    .logo h1 { font-size: 26px; font-weight: 700; color: #1a237e; letter-spacing: 1px; }
    .logo p { font-size: 13px; color: #888; margin-top: 4px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      letter-spacing: 3px;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus { border-color: #1a237e; }
    .hint { font-size: 11px; color: #aaa; margin-top: 5px; }
    .btn {
      width: 100%;
      padding: 13px;
      background: #1a237e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 22px;
      transition: background 0.2s;
    }
    .btn:hover { background: #283593; }
    .btn:disabled { background: #90a4ae; cursor: not-allowed; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 16px;
    }
    .divider hr { flex: 1; border: none; border-top: 1px solid #eee; }
    .divider span { font-size: 12px; color: #bbb; }
    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #1a237e;
      border: 1.5px solid #1a237e;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: #e8eaf6; }
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 14px;
      display: none;
    }
    .footer { text-align: center; margin-top: 24px; font-size: 11px; color: #ccc; }
    .badge {
      display: inline-block;
      background: #e3f2fd;
      color: #1565c0;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      margin-left: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="icon">🩺</span>
      <h1>MedVocab <span class="badge">DEMO</span></h1>
      <p>ระบบทบทวนคำศัพท์ทางการแพทย์ · โลหิตวิทยา</p>
    </div>

    <label>รหัสผู้ใช้ (ตัวเลข 3 หลักที่ตั้งไว้ตอนลงทะเบียน)</label>
    <input type="password" id="uid" placeholder="•••" maxlength="3" inputmode="numeric">
    <p class="hint">ระบบไม่เก็บชื่อหรือรหัสนิสิต — ใช้รหัส 3 หลักส่วนตัวเป็นตัวระบุเท่านั้น</p>

    <button class="btn" id="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="error" id="err"></div>

    <div class="divider"><hr><span>ยังไม่มีบัญชี?</span><hr></div>

    <button class="btn-secondary" onclick="location.href='demo-register.html'">
      📝 ลงทะเบียนครั้งแรก (Register)
    </button>

    <div class="footer">
      คณะแพทยศาสตร์ มหาวิทยาลัยบูรพา · ปีการศึกษา 2569<br>
      ข้อมูลส่วนบุคคลได้รับการคุ้มครองตาม PDPA
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dbchducvmgkkccwemmhl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5O2V4_4eY3umLJgQhm6BAQ_0psABX8g';
    const HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    };

    async function doLogin() {
      const uid = document.getElementById('uid').value.trim();
      const err = document.getElementById('err');
      const btn = document.getElementById('login-btn');
      err.style.display = 'none';

      if (uid.length !== 3 || isNaN(uid)) {
        err.textContent = '⚠️ กรุณากรอกตัวเลข 3 หลักให้ครบถ้วน';
        err.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'กำลังตรวจสอบ...';

      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/users?uid=eq.${uid}&select=uid,group,pre_test_done`,
          { headers: HEADERS }
        );
        const data = await res.json();

        if (!data || data.length === 0) {
          err.textContent = '❌ ไม่พบบัญชีนี้ในระบบ กรุณาลงทะเบียนก่อน';
          err.style.display = 'block';
        } else {
          localStorage.setItem('mv_current', uid);
          location.href = 'demo-home.html';
        }
      } catch (e) {
        err.textContent = '❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
        err.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
