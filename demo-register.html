<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedVocab — ลงทะเบียน</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1565c0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 36px;
      width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .back { color: #1a237e; font-size: 13px; cursor: pointer; margin-bottom: 20px; display: inline-block; }
    .back:hover { text-decoration: underline; }
    h2 { font-size: 20px; color: #1a237e; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      letter-spacing: 3px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 4px;
    }
    input:focus { border-color: #1a237e; }
    .hint { font-size: 11px; color: #aaa; margin-bottom: 18px; }
    .pin-box {
      background: #e8eaf6;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #3949ab;
      margin-bottom: 18px;
      line-height: 1.6;
    }
    .consent-box {
      background: #f9fbe7;
      border: 1px solid #dce775;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      color: #555;
      margin: 18px 0;
      line-height: 1.6;
    }
    .consent-box label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      color: #444;
      font-weight: normal;
    }
    .consent-box input[type="checkbox"] {
      width: auto;
      margin: 0;
      margin-top: 2px;
      letter-spacing: 0;
      padding: 0;
      border: none;
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: #1a237e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #283593; }
    .btn:disabled { background: #90a4ae; cursor: not-allowed; }
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .success {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="back" onclick="location.href='demo-login.html'">← กลับหน้าเข้าสู่ระบบ</span>
    <h2>📝 ลงทะเบียน</h2>
    <p class="sub">สำหรับนิสิตแพทย์ชั้นปีที่ 3 คณะแพทยศาสตร์ มหาวิทยาลัยบูรพา</p>

    <label>ตั้งรหัสผู้ใช้ (ตัวเลข 3 หลักอะไรก็ได้ที่จำได้)</label>
    <input type="password" id="uid" placeholder="เช่น 315" maxlength="3" inputmode="numeric">
    <p class="hint">ใช้ตัวเลข 3 หลักที่จำง่าย เช่น วันเกิด หรือเลขที่ชอบ</p>
    <div style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:10px 12px;font-size:12px;color:#795548;margin-bottom:18px;">
      ⚠️ <strong>สำคัญ:</strong> กรุณาจดรหัส 3 หลักนี้ไว้ เพราะระบบไม่สามารถกู้คืนรหัสได้หากลืม
    </div>

    <label>รหัสกลุ่ม (รับจากผู้วิจัย)</label>
    <input type="password" id="groupPin" placeholder="••••••" autocomplete="off">
    <div class="pin-box">
      🔑 กรอกรหัสกลุ่มที่ได้รับจากผู้วิจัย ระบบจะกำหนดกลุ่มให้อัตโนมัติ
    </div>

    <div class="consent-box">
      <label>
        <input type="checkbox" id="consent">
        ข้าพเจ้ายินยอมเข้าร่วมการวิจัยโดยสมัครใจ และรับทราบว่าข้อมูลที่เก็บรวบรวมจะถูกนำไปใช้เพื่อวัตถุประสงค์ทางวิชาการเท่านั้น ข้าพเจ้าสามารถถอนตัวได้ทุกเมื่อโดยไม่มีผลกระทบต่อการเรียน
      </label>
    </div>

    <button class="btn" id="reg-btn" onclick="doRegister()">ลงทะเบียนและเริ่มต้นใช้งาน</button>
    <div class="error" id="err"></div>
    <div class="success" id="ok"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dbchducvmgkkccwemmhl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5O2V4_4eY3umLJgQhm6BAQ_0psABX8g';
    const HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    };

    // === Group PINs — เปลี่ยนได้ตามต้องการ ===
    const GROUP_PINS = {
      'ODD25':  'odd',
      'EVEN25': 'even'
    };

    async function doRegister() {
      const uid     = document.getElementById('uid').value.trim();
      const pinRaw  = document.getElementById('groupPin').value.trim().toUpperCase();
      const consent = document.getElementById('consent').checked;
      const err     = document.getElementById('err');
      const ok      = document.getElementById('ok');
      const btn     = document.getElementById('reg-btn');
      err.style.display = 'none';
      ok.style.display  = 'none';

      // Validate UID
      if (uid.length !== 3 || isNaN(uid)) {
        err.textContent = '⚠️ กรุณากรอกตัวเลข 3 หลักให้ครบถ้วน';
        err.style.display = 'block'; return;
      }

      // Validate Group PIN
      if (!pinRaw) {
        err.textContent = '⚠️ กรุณากรอกรหัสกลุ่มที่ได้รับจากผู้วิจัย';
        err.style.display = 'block'; return;
      }
      const group = GROUP_PINS[pinRaw];
      if (!group) {
        err.textContent = '❌ รหัสกลุ่มไม่ถูกต้อง กรุณาตรวจสอบรหัสที่ได้รับอีกครั้ง';
        err.style.display = 'block'; return;
      }

      // Validate Consent
      if (!consent) {
        err.textContent = '⚠️ กรุณายืนยันความยินยอมก่อนลงทะเบียน';
        err.style.display = 'block'; return;
      }

      btn.disabled = true;
      btn.textContent = 'กำลังตรวจสอบ...';

      try {
        // Check duplicate
        const checkRes = await fetch(
          `${SUPABASE_URL}/rest/v1/users?uid=eq.${uid}&select=uid`,
          { headers: HEADERS }
        );
        const existing = await checkRes.json();

        if (existing && existing.length > 0) {
          err.textContent = `❌ รหัส ${uid} มีคนใช้แล้ว กรุณาเลือกเลข 3 หลักใหม่`;
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'ลงทะเบียนและเริ่มต้นใช้งาน';
          return;
        }

        // Insert new user
        const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
          method: 'POST',
          headers: { ...HEADERS, 'Prefer': 'return=minimal' },
          body: JSON.stringify({
            uid,
            group,
            registered_at: new Date().toISOString(),
            pre_test_done: false,
            post_test_done: false
          })
        });

        if (!insertRes.ok) throw new Error('Insert failed');

        localStorage.setItem('mv_current', uid);
        ok.textContent = '✅ ลงทะเบียนสำเร็จ! กำลังเข้าสู่ระบบ...';
        ok.style.display = 'block';
        setTimeout(() => location.href = 'demo-home.html', 1200);

      } catch (e) {
        err.textContent = '❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'ลงทะเบียนและเริ่มต้นใช้งาน';
      }
    }
  </script>
</body>
</html>
